<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8d8ef">
<title>Koky’s Cookies | Links</title>
<style>
:root{color-scheme:light;--pink:#f8d8ef;--olive:#68751b;--olive-dark:#4c5711;--cream:#fff8fc;--pink2:#f2bfe1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:#fbe8f5}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(circle at 15% 10%,#fff1fa 0,transparent 28%),linear-gradient(145deg,var(--pink),#fbe8f5);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--olive-dark)}
main{width:min(100%,430px);text-align:center}
.logo-wrap{overflow:hidden;border-radius:26px;background:var(--pink);box-shadow:0 15px 45px #80506b20;border:2px solid #ffffffa8;padding:44px 20px}
.wordmark{margin:0;font-family:"Arial Rounded MT Bold","Chalkboard SE","Trebuchet MS",ui-rounded,system-ui,sans-serif;font-weight:900;color:var(--olive);line-height:.95;letter-spacing:.01em;text-shadow:0 3px 0 #fff8fc}
.wordmark .k{display:block;font-size:clamp(52px,16vw,76px)}
.wordmark .c{display:block;font-size:clamp(34px,10vw,50px);margin-top:4px}
.tagline{font-size:14px;letter-spacing:.04em;margin:20px 0 24px;color:#6b5d4f}
.links{display:grid;gap:13px}
a.link{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fff9f4;background:var(--olive);padding:17px 20px;border-radius:17px;font-weight:800;letter-spacing:.015em;border:2px solid var(--olive);box-shadow:0 5px 0 var(--olive-dark);transition:transform .15s,box-shadow .15s}
a.link:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--olive-dark)}
a.link:active{transform:translateY(2px);box-shadow:0 2px 0 var(--olive-dark)}
a.link.secondary{background:#fff8fc;color:var(--olive-dark);border-color:#e8b9d9;box-shadow:0 5px 0 #e8b9d9}
a.link.secondary:hover{box-shadow:0 7px 0 #e8b9d9}
.icon{width:22px;height:22px;flex:none}
footer{font-size:12px;color:#806d7b;margin-top:28px}
@media(min-width:600px){main{width:min(100%,390px)}}
</style>
</head>
<body>
<main>
  <div class="logo-wrap" role="img" aria-label="Koky’s Cookies logo">
    <h1 class="wordmark"><span class="k">Koky’s</span><span class="c">Cookies</span></h1>
  </div>
  <p class="tagline">A little sweetness goes a long way ♡</p>
  <nav class="links" aria-label="Koky’s Cookies contact links">
    <a class="link" id="email-link" href="mailto:Kokyscookies@outlook.com" aria-label="Email Koky’s Cookies">
      <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Email Koky’s Cookies
    </a>
    <a class="link secondary" href="https://www.instagram.com/thekokysclub/" target="_blank" rel="noopener noreferrer" aria-label="Visit Koky’s Cookies on Instagram">
      <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      Follow us on Instagram
    </a>
  </nav>
  <footer>Made with love &amp; a little cookie magic 🍪</footer>
</main>
<script>
(function(){
  var a=document.getElementById('email-link');
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!a)return;
  var mobile=ios||/Android|Mobile/i.test(navigator.userAgent);
  if(!mobile){
    a.href='https://mail.google.com/mail/?view=cm&fs=1&to=Kokyscookies%40outlook.com';
    a.target='_blank';
    a.rel='noopener noreferrer';
    return;
  }
  if(!ios)return;
  a.addEventListener('click',function(e){
    e.preventDefault();
    var t=setTimeout(function(){window.location.href='mailto:Kokyscookies@outlook.com';},900);
    document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(t);});
    window.location.href='googlegmail:///co?to=Kokyscookies@outlook.com';
  });
})();
</script>
</body>
</html>
